name: Android Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, such as 1.0.0 or v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Add these as secrets on the android-release environment:
    # ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_STORE_PASSWORD,
    # ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_KEY_PASSWORD, MAPBOX_DOWNLOADS_TOKEN
    # MYCHU_UPGRADELINK_CONFIG_JSON (same JSON schema as config/upgradelink.example.json)
    # Add MAPBOX_PUBLIC_ACCESS_TOKEN as an Actions variable on this environment.
    environment: android-release
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Check tag and app version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          app_version="${app_version%%+*}"
          tag_version="${RELEASE_TAG#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$app_version" ]]; then
            echo "::error::Release tag must match pubspec.yaml version (optionally prefixed with v)."
            exit 1
          fi

      - name: Verify target Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::The target GitHub Release must be published before building."
            exit 1
          fi

      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          secret_names = (
              "ANDROID_RELEASE_KEYSTORE_BASE64",
              "ANDROID_RELEASE_STORE_PASSWORD",
              "ANDROID_RELEASE_KEY_ALIAS",
              "ANDROID_RELEASE_KEY_PASSWORD",
          )
          secrets = {name: os.environ.get(name, "") for name in secret_names}
          missing = [name for name, value in secrets.items() if not value]
          if missing:
              raise SystemExit("Missing Android release secrets: " + ", ".join(missing))

          encoded_keystore = "".join(secrets[secret_names[0]].split())
          try:
              keystore = base64.b64decode(encoded_keystore, validate=True)
          except ValueError as error:
              raise SystemExit("ANDROID_RELEASE_KEYSTORE_BASE64 is not valid Base64.") from error
          if not keystore:
              raise SystemExit("The decoded Android keystore is empty.")

          def escape_property(value: str) -> str:
              if any(ord(char) < 0x20 or ord(char) > 0x7E for char in value):
                  raise SystemExit("Android signing properties must contain printable ASCII only.")
              escaped = []
              for index, char in enumerate(value):
                  if char == "\\" or char in "=:#!" or (char == " " and index == 0):
                      escaped.append("\\")
                  escaped.append(char)
              return "".join(escaped)

          Path("android/mychu-release.jks").write_bytes(keystore)
          properties = (
              "storeFile=mychu-release.jks",
              "storePassword=" + escape_property(secrets["ANDROID_RELEASE_STORE_PASSWORD"]),
              "keyAlias=" + escape_property(secrets["ANDROID_RELEASE_KEY_ALIAS"]),
              "keyPassword=" + escape_property(secrets["ANDROID_RELEASE_KEY_PASSWORD"]),
          )
          Path("android/key.properties").write_text("\n".join(properties) + "\n", encoding="ascii")
          PY

      - name: Prepare native UpgradeLink build configuration
        shell: bash
        env:
          UL_CONFIG_JSON: ${{ secrets.MYCHU_UPGRADELINK_CONFIG_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          try:
              config = json.loads(os.environ.get('UL_CONFIG_JSON', ''))
          except ValueError:
              raise SystemExit('Configure MYCHU_UPGRADELINK_CONFIG_JSON in the android-release environment.')
          keys = ('MYCHU_UPGRADELINK_APK_KEY', 'MYCHU_UPGRADELINK_ACCESS_KEY', 'MYCHU_UPGRADELINK_SECRET_KEY')
          if not isinstance(config, dict) or any(not isinstance(config.get(k), str) or not config[k].strip() for k in keys):
              raise SystemExit('Incomplete native UpgradeLink build configuration.')
          for k in keys:
              print('::add-mask::' + config[k])
          os.umask(0o077)
          path = Path(os.environ['RUNNER_TEMP']) / 'mychu-upgradelink.json'
          path.write_text(json.dumps(config), encoding='utf-8')
          PY

      - name: Build and validate arm64-v8a Official APK
        id: build
        shell: bash
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          MAPBOX_PUBLIC_ACCESS_TOKEN: ${{ vars.MAPBOX_PUBLIC_ACCESS_TOKEN }}
          MYCHU_SUPABASE_URL: ${{ vars.MYCHU_SUPABASE_URL }}
          MYCHU_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MYCHU_SUPABASE_PUBLISHABLE_KEY }}
          MYCHU_PRIVACY_BASE_URL: ${{ vars.MYCHU_PRIVACY_BASE_URL || 'https://mychu-policy.rinn.moe/' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$MAPBOX_DOWNLOADS_TOKEN" ]]; then
            echo "::error::Configure MAPBOX_DOWNLOADS_TOKEN in the android-release environment."
            exit 1
          fi
          if [[ "$MAPBOX_PUBLIC_ACCESS_TOKEN" != pk.* || "${#MAPBOX_PUBLIC_ACCESS_TOKEN}" -le 3 ]]; then
            echo "::error::Configure MAPBOX_PUBLIC_ACCESS_TOKEN as an Actions variable with a Mapbox public pk.* token."
            exit 1
          fi
          export MYCHU_BUILD_CHANNEL=official
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          pwsh -NoLogo -NoProfile -File scripts/build_android_release.ps1 \
            -Channel official \
            -UpgradeLinkConfigFile "$RUNNER_TEMP/mychu-upgradelink.json" \
            -GitSha "$GIT_SHA" \
            -BuildId "release-$RUN_ID" \
            -BuildTimeUtc "$build_time"
          apk_path="$(find output/releases -maxdepth 1 -type f -name 'MyCHU-*-arm64-v8a-release.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "::error::The validated release APK was not produced."
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          release_apk_path="$RUNNER_TEMP/MyCHU-${release_version}-arm64-v8a-release.apk"
          cp -- "$apk_path" "$release_apk_path"
          echo "apk_path=$release_apk_path" >> "$GITHUB_OUTPUT"
          sha256sum "$release_apk_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private build files
        if: always()
        shell: bash
        run: rm -f android/key.properties android/mychu-release.jks "$RUNNER_TEMP/mychu-upgradelink.json"

      - name: Upload APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          set -euo pipefail
          # A published artifact is immutable: rebuilding the same tag must never
          # replace different bytes, or the delta base stops matching devices.
          # Any API failure aborts here instead of falling through to an upload.
          name="$(basename "$APK_PATH")"
          want="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          release_api="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          names="$(gh api "$release_api" --jq '.assets[].name')"
          if printf '%s\n' "$names" | grep -Fxq "$name"; then
            digest="$(gh api "$release_api" --jq ".assets[] | select(.name == \"${name}\") | .digest // \"\"")"
            if [[ -z "$digest" ]]; then
              tmp="$(mktemp -d)"
              gh release download "$RELEASE_TAG" -p "$name" -D "$tmp" --clobber
              digest="sha256:$(sha256sum "${tmp}/${name}" | cut -d' ' -f1)"
              rm -rf "$tmp"
            fi
            if [[ "$digest" != "sha256:${want}" ]]; then
              echo "::error::The release already carries different bytes for ${name}."
              exit 1
            fi
            echo "::notice::${name} is already attached with identical bytes; keeping it."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "$APK_PATH"

  delta:
    # Runs automatically once the APK is attached: the patch is generated against
    # the previous release's APK, so no extra manual trigger is needed.
    needs: build-and-upload
    if: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HDIFFPATCH_VERSION: '5.1.3'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false

      - name: Fetch HDiffPatch
        shell: bash
        run: |
          set -euo pipefail
          # Pinned: patch bytes differ across hdiffz versions.
          url="https://github.com/sisong/HDiffPatch/releases/download/v${HDIFFPATCH_VERSION}/hdiffpatch_v${HDIFFPATCH_VERSION}_bin_linux64.zip"
          curl -fsSL "$url" -o /tmp/hdiffpatch.zip
          unzip -q /tmp/hdiffpatch.zip -d /tmp/hdiffpatch
          install -m 0755 "$(find /tmp/hdiffpatch -name hdiffz -type f | head -1)" /usr/local/bin/hdiffz
          install -m 0755 "$(find /tmp/hdiffpatch -name hpatchz -type f | head -1)" /usr/local/bin/hpatchz
          hdiffz -v

      - name: Prepare Android tools
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk" ]]; then
            echo "::error::No Android SDK: ANDROID_HOME and ANDROID_SDK_ROOT are both unset or missing."
            exit 1
          fi
          # The runner image ships cmdline-tools and build-tools but leaves them off
          # PATH, and $GITHUB_PATH only affects later steps: resolve them here.
          # sdkmanager cannot install itself, so a missing toolchain is an error.
          cmdline_bin="$(ls -d "$sdk"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1 || true)"
          build_tools="$(ls -d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$cmdline_bin" ]]; then export PATH="$cmdline_bin:$PATH"; fi
          if [[ -n "$build_tools" ]]; then export PATH="$build_tools:$PATH"; fi
          export PATH="$sdk/platform-tools:$PATH"
          if ! command -v apkanalyzer >/dev/null || ! command -v apksigner >/dev/null; then
            echo "::error::apkanalyzer and apksigner must be installed under $sdk (cmdline-tools and build-tools)."
            exit 1
          fi
          if [[ -n "$cmdline_bin" ]]; then echo "$cmdline_bin" >> "$GITHUB_PATH"; fi
          if [[ -n "$build_tools" ]]; then echo "$build_tools" >> "$GITHUB_PATH"; fi

      - name: Resolve the previous release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          # Compare versions, not release order: a backfilled or re-published
          # older tag must never become the base of a newer one.
          current="${RELEASE_TAG#v}"
          # Keep the request and the split separate: a process substitution
          # hides a failing `gh api` behind an empty list.
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          tag_list="$(printf '%s' "$releases" | jq -r '.[]
            | select(.draft == false and .prerelease == false)
            | select(any(.assets[]; (.name | endswith(".apk"))))
            | .tag_name')"
          mapfile -t tags <<< "$tag_list"
          previous=""
          previous_version=""
          for tag in "${tags[@]}"; do
            [[ -z "$tag" ]] && continue
            version="${tag#v}"
            # Reject anything that is not a plain dotted version.
            [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || continue
            [[ "$version" == "$current" ]] && continue
            # Only versions that sort strictly below the target are candidates.
            first="$(printf '%s\n%s\n' "$version" "$current" | sort -V | head -1)"
            [[ "$first" == "$version" ]] || continue
            if [[ -z "$previous_version" ]] ||
               [[ "$(printf '%s\n%s\n' "$previous_version" "$version" | sort -V | tail -1)" == "$version" ]]; then
              previous="$tag"
              previous_version="$version"
            fi
          done
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
          if [[ -z "$previous" ]]; then
            echo "::notice::No earlier release with an APK; skipping delta generation."
          else
            echo "Base release: $previous ($previous_version)"
          fi

      - name: Download the new and previous APKs
        if: ${{ steps.previous.outputs.tag != '' }}
        shell: bash
        env:
          # Never interpolate a release tag straight into the script body.
          BASE_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_TAG" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unexpected base tag: ${BASE_TAG}"
            exit 1
          fi
          mkdir -p work/target work/base
          gh release download "$RELEASE_TAG" -p '*.apk' -D work/target --clobber
          gh release download "$BASE_TAG" -p '*.apk' -D work/base --clobber
          ls -l work/target work/base

      - name: Build the verified patch
        if: ${{ steps.previous.outputs.tag != '' }}
        shell: pwsh
        run: |
          $targets = @(Get-ChildItem work/target -Filter *.apk)
          $bases = @(Get-ChildItem work/base -Filter *.apk)
          if ($targets.Count -ne 1 -or $bases.Count -ne 1) {
            throw 'Expected exactly one APK on each side.'
          }
          pwsh -NoLogo -NoProfile -File scripts/build_delta_update.ps1 `
            -TargetApk $targets[0].FullName `
            -BaseApks @($bases[0].FullName) `
            -OutputDirectory work/out `
            -Overwrite

      - name: Upload the patch to the release
        if: ${{ steps.previous.outputs.tag != '' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(work/out/*.hdiff)
          if [[ ${#patches[@]} -eq 0 ]]; then
            echo "::warning::The base produced no valid patch; the release ships the full package only."
            exit 0
          fi
          # The patch name already encodes both digests; an existing asset must
          # match byte for byte, otherwise the manifest and the file diverge.
          for file in work/out/*; do
            name="$(basename "$file")"
            want="$(sha256sum "$file" | cut -d' ' -f1)"
            digest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
              --jq ".assets[] | select(.name == \"${name}\") | .digest // \"\"")"
            if [[ -n "$digest" && "$digest" != "sha256:${want}" ]]; then
              echo "::error::The release already carries different bytes for ${name}."
              exit 1
            fi
            if [[ -z "$digest" ]]; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
