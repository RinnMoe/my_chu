name: mychu
description: 长安大学第三方校园助手
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 1.9.0 的 Android 脚本缺少 Kotlin Android 插件应用，无法在 Flutter 插件构建中编译。
  dynamic_color: 1.8.1
  shared_preferences: ^2.3.0
  tutorial_coach_mark: ^1.3.4
  flutter_secure_storage: ^9.2.0
  flutter_blue_plus: 1.36.8
  flutter_blue_plus_ohos:
    path: third_party/flutter_blue_plus_ohos
  mobile_scanner: 7.4.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  # 外部地图 URI 调起（仅跳转，不接入任何地图 SDK）。
  url_launcher: ^6.3.2
  url_launcher_ohos:
    path: third_party/flutter_packages_ohos/packages/url_launcher/url_launcher_ohos
  permission_handler: ^11.3.1
  geolocator: ^14.0.2
  html: ^0.15.6
  flutter_local_notifications: ^22.2.0
  http: ^1.6.0
  crypto: ^3.0.7
  aptabase_flutter: ^0.5.0
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_ohos:
    path: third_party/flutter_inappwebview_ohos
  dio: ^5.8.0
  # 统一身份静默重登：复刻官方登录页 AES-128-CBC 密码加密（纯 Dart，无原生依赖）。
  pointycastle: ^3.9.1
  # Official Mapbox renderer + hosted basemap/style/tile delivery.
  mapbox_maps_flutter: ^2.28.0
  file_selector: ^1.1.0
  archive: ^4.0.9
  # Local ddddocr 1.6.1 captcha inference; no image data leaves the device.
  flutter_onnxruntime: 1.8.4
  image: ^4.1.2
  zxing2: ^0.2.4
  # OHOS federated file picker; hosted implementations remain selected elsewhere.
  file_selector_ohos:
    path: third_party/flutter_packages_ohos/packages/file_selector/file_selector_ohos
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/campus_building.png
    - assets/splash/campus_building_splash.png
    # SDK-independent campus semantics used for first install and offline
    # startup. Mapbox owns basemap/style/tile/glyph/sprite resources.
    - assets/maps/campuses.json
    - assets/maps/place_code_rules.json
    - assets/maps/weishui/places.json
    # WX3 indoor geometry stays separate from the outdoor semantic catalog.
    - assets/maps/indoor/wx3/indoor_building_manifest.json
    - assets/maps/indoor/wx3/mapbox/wx3_indoor_runtime.geojson
    - assets/maps/indoor/wx3/mapbox/wx3_indoor_interaction.geojson
    - assets/maps/indoor/wx2/indoor_building_manifest.json
    - assets/maps/indoor/wx2/mapbox/wx2_indoor_runtime.geojson
    - assets/maps/indoor/wx2/mapbox/wx2_indoor_interaction.geojson
    - assets/maps/indoor/wm2/indoor_building_manifest.json
    - assets/maps/indoor/wm2/mapbox/wm2_indoor_runtime.geojson
    - assets/maps/indoor/wm2/mapbox/wm2_indoor_interaction.geojson
    - assets/maps/beiyuan/places.json
    - assets/maps/yanta/places.json
    - assets/maps/xiaozhai/places.json
    - assets/data/public_holidays/2024.json
    - assets/data/public_holidays/2025.json
    - assets/data/public_holidays/2026.json
    - assets/data/public_holidays/2027.json
    - assets/models/ddddocr/
    - test/fixtures/captcha/synthetic_1234.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true

flutter_native_splash:
  # Native launch artwork is exported at 4x. Android 12 uses a smaller
  # composition so the full horizontal building stays inside its circular mask.
  # The transparent artwork is shared by light and dark modes; only the
  # native background color changes.
  color: "#F7F6FA"
  color_dark: "#181A1C"
  image: assets/splash/campus_building_splash.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F7F6FA"
    color_dark: "#181A1C"
    image: assets/splash/campus_building_android12.png
