<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MyCHU AI reset</title>
  </head>
  <body>
    <script>
      // 由 MyCHU 的 reset WebView 通过 callAsyncJavaScript 调用。
      // 只删除 chat-demo 的数据库、chat-demo:* 键和本 Origin 的 CacheStorage；
      // 不触碰其他 Origin，也不读取或修改任何 API Key。
      window.clearMyChuChatDemo = async function () {
        const result = { database: 'unknown', keys: 0, caches: 0 };
        result.database = await new Promise((resolve) => {
          let settled = false;
          const finish = (value) => {
            if (!settled) {
              settled = true;
              resolve(value);
            }
          };
          const request = indexedDB.deleteDatabase('chat-demo');
          request.onsuccess = () => finish('deleted');
          request.onerror = () => finish('error');
          request.onblocked = () => finish('blocked');
          setTimeout(() => finish('timeout'), 5000);
        });

        for (const storage of [localStorage, sessionStorage]) {
          for (const key of Object.keys(storage)) {
            if (key.startsWith('chat-demo:')) {
              storage.removeItem(key);
              result.keys++;
            }
          }
        }

        if ('caches' in window) {
          const names = await caches.keys();
          for (const name of names) {
            if (await caches.delete(name)) result.caches++;
          }
        }
        return result;
      };
    </script>
  </body>
</html>
